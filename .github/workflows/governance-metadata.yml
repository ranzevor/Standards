name: Governance metadata

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governance-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: governance-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate PR and commit metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/governance_gate.cjs pr
