name: Standards quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner_mode:
        description: 运行器选择；auto 读取私有仓库额度耗尽标记
        required: false
        default: auto
        type: choice
        options:
          - auto
          - github-hosted
          - mu-fallback

permissions:
  contents: read

concurrency:
  group: standards-quality-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  contracts:
    runs-on: >-
      ${{ fromJSON(github.event.repository.private
          && github.actor_id == github.repository_owner_id
          && github.triggering_actor == github.repository_owner
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && (inputs.runner_mode == 'mu-fallback' || ((inputs.runner_mode == '' || inputs.runner_mode == 'auto') && vars.STANDARDS_PRIVATE_ACTIONS_EXHAUSTED == 'true'))
          && format('["mu-fallback-linux-x64","mu-run-{0}-{1}","mu-job-validate"]', github.run_id, github.run_attempt)
          || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Record Python identity
        run: python --version
      - name: Check generated registries
        run: python checks/generate_registry.py --check
      - name: Check generated navigation
        run: python checks/generate_index.py --check
      - name: Validate repository contracts
        run: python checks/validate_all.py
      - name: Validate Agent Skill with official skills-ref
        run: |
          python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          skill_dir="$(mktemp -d)"
          trap 'rm -rf "$skill_dir"' EXIT
          mkdir -p "$skill_dir/ranzevor-standards"
          cp skills/ranzevor-standards/SKILL.md.in "$skill_dir/ranzevor-standards/SKILL.md"
          skills-ref validate "$skill_dir/ranzevor-standards"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v

  native-consumers:
    uses: ./.github/workflows/platform.yml
    with:
      runner_mode: ${{ inputs.runner_mode || 'auto' }}

  validate:
    name: validate
    needs: [contracts, native-consumers]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject incomplete or failed required prerequisites
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CONSUMERS_RESULT: ${{ needs.native-consumers.result }}
        shell: bash
        run: |
          echo "contracts=$CONTRACTS_RESULT; native-consumers=$CONSUMERS_RESULT"
          if [[ "$CONTRACTS_RESULT" != "success" || "$CONSUMERS_RESULT" != "success" ]]; then
            echo "::error::Required quality and native consumer checks must both succeed"
            exit 1
          fi
