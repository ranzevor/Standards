name: OPC open pull request

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: 已提交到本仓库的候选分支
        required: true
        type: string
      title:
        description: 符合仓库约定的中文 PR 标题
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  create:
    name: create-opc-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only the trusted default-branch PR template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create a draft PR with the built-in GitHub Actions identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ACTOR: ${{ github.actor }}
          RUN_ACTOR_ID: ${{ github.actor_id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_OWNER_ID: ${{ github.repository_owner_id }}
          RUN_REF: ${{ github.ref }}
          BASE: ${{ github.event.repository.default_branch }}
          HEAD: ${{ inputs.head_branch }}
          TITLE: ${{ inputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUN_ACTOR" != "$REPO_OWNER" || "$RUN_ACTOR_ID" != "$REPO_OWNER_ID" || "$RUN_REF" != "refs/heads/$BASE" ]]; then
            echo "::error::Only the repository owner may run this workflow from the default branch"
            exit 1
          fi
          if [[ ! "$HEAD" =~ ^(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert|release|hotfix|feature|maintenance|quality|archive|automation|data|content|diagnostic|dependabot)/[a-z0-9][a-z0-9._/-]{2,95}$ || "$HEAD" == "$BASE" ]]; then
            echo "::error::Only an existing, correctly named non-default branch is accepted"
            exit 1
          fi
          if [[ -z "${TITLE//[[:space:]]/}" ]]; then
            echo "::error::PR title is required"
            exit 1
          fi
          head_sha="$(gh api "repos/$GH_REPO/branches/$HEAD" --jq '.commit.sha')"
          if [[ ! "$head_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Candidate branch does not resolve to an exact Git commit"
            exit 1
          fi
          body="$(cat .github/pull_request_template.md)"
          gh api -X POST "repos/$GH_REPO/pulls" -f head="$HEAD" -f base="$BASE" \
            -f title="$TITLE" -f body="$body" -F draft=true --jq '.html_url'
